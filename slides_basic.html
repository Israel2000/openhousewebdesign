<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>No. 214 Alder Row - Slide Viewer</title>
  <style>
    :root {
      --bg-color: #f8fafc;
      --card-bg: #ffffff;
      --text-color: #1e293b;
      --text-muted: #64748b;
      --accent-color: #0284c7;
      --border-color: #e2e8f0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 1rem;
    }

    .viewer-container {
      width: 100%;
      max-width: 800px;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    .slide-card {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 3rem 2.5rem;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
      min-height: 400px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
    }

    .slide-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.85rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 1px;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 1rem;
      margin-bottom: 2rem;
    }

    .slide-content {
      flex-grow: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 1rem;
    }

    .slide-title {
      font-size: 1.75rem;
      font-weight: 700;
      color: var(--text-color);
      line-height: 1.3;
    }

    .slide-body {
      font-size: 1.1rem;
      color: var(--text-muted);
      line-height: 1.6;
      white-space: pre-line;
    }

    .slide-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-top: 1px solid var(--border-color);
      padding-top: 1rem;
      margin-top: 2rem;
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    button {
      background-color: var(--accent-color);
      color: white;
      border: none;
      padding: 0.75rem 1.5rem;
      border-radius: 6px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    button:hover {
      background-color: #0369a1;
    }

    button:disabled {
      background-color: var(--border-color);
      color: var(--text-muted);
      cursor: not-allowed;
    }

    .counter {
      font-weight: 600;
      color: var(--text-color);
    }
  </style>
</head>
<body>

  <div class="viewer-container">
    <div class="slide-card">
      <div class="slide-header">
        <span id="slide-section">Open House / Web Kit</span>
        <span>No. 214 Alder Row</span>
      </div>
      
      <div class="slide-content">
        <div class="slide-title" id="slide-title">Loading...</div>
        <div class="slide-body" id="slide-body">Please wait while slides load.</div>
      </div>

      <div class="slide-footer">
        <span>Home | Listing | Open House | Website | Contact</span>
        <span id="slide-page-num">/01</span>
      </div>
    </div>

    <div class="controls">
      <button id="prev-btn" onclick="prevSlide()" disabled>Previous</button>
      <div class="counter"><span id="current-num">1</span> / <span id="total-num">20</span></div>
      <button id="next-btn" onclick="nextSlide()">Next</button>
    </div>
  </div>

  <script>

        body: "CMA, VISUALIZED\n\n• Comp A: $498 / sq ft\n• Comp B: $512 / sq ft\n• No. 214: $518 / sq ft\n• Comp C: $535 / sq ft\n\n$ / SQ FT BARS + DAYS ON MARKET LINE",
        page: "/17"
      },
      {
        section: "OPEN HOUSE / WEB KIT",
        title: "FOLLOW-UP / THREE TOUCHES",
        body: "KEEP THE NEXT STEP CLEAR\n\n• 24H: Send the property pack (Plan, features and offer process)\n• 72H: Ask one useful question (Capture fit, concern and timing)\n• 7D: Close the feedback loop (Share status or next showing)\n\nNEXT ACTION / OFFER TIMELINE",
        page: "/18"
      },
      {
        section: "OPEN HOUSE / WEB KIT",
        title: "CLIENT FEEDBACK / SAMPLE QUOTE",
        body: "A VISIT THAT FELT EFFORTLESS\n\n“The page answered our practical questions before we arrived, and the guided route let us focus on how the rooms actually lived.”\n\nProspective buyer / sample testimonial\nSubmitted three days after the open house",
        page: "/19"
      },
      {
        section: "OPEN HOUSE / WEB KIT",
        title: "CONTACT / NEXT STEP",
        body: "THANKS.\nBring the listing, visit plan and lead path into one clear open-house experience.\n\n• EMAIL: hello@alderrow.example\n• PHONE: +1 555 014 0214\n• VISIT: No. 214 Alder Row / sample address",
        page: "/20"
      }
    ];

    let currentIndex = 0;

    function updateSlide() {
      const slide = slides[currentIndex];
      document.getElementById('slide-section').textContent = slide.section;
      document.getElementById('slide-title').textContent = slide.title;
      document.getElementById('slide-body').textContent = slide.body;
      document.getElementById('slide-page-num').textContent = slide.page;
      document.getElementById('current-num').textContent = currentIndex + 1;
      document.getElementById('total-num').textContent = slides.length;

      document.getElementById('prev-btn').disabled = currentIndex === 0;
      document.getElementById('next-btn').disabled = currentIndex === slides.length - 1;
    }

    function nextSlide() {
      if (currentIndex < slides.length - 1) {
        currentIndex++;
        updateSlide();
      }
    }

    function prevSlide() {
      if (currentIndex > 0) {
        currentIndex--;
        updateSlide();
      }
    }

    // Keyboard navigation support
    document.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight' || e.key === 'Space') {
        nextSlide();
      } else if (e.key === 'ArrowLeft') {
        prevSlide();
      }
    });

    // Initialize
    updateSlide();
  </script>
</body>
</html>
